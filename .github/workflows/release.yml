name: Release
on:
  push:
    tags: ['core-v*']
permissions:
  contents: write
jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ForgeTools.slnx --configfile NuGet.Config
      - run: dotnet publish src/Forge.App/Forge.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:UseAppHost=true -o publish/${{ matrix.rid }}
      - name: Verify application launcher
        shell: pwsh
        run: |
          $launcher = if ('${{ matrix.rid }}' -eq 'win-x64') { 'Forge.App.exe' } else { 'Forge.App' }
          $path = Join-Path 'publish/${{ matrix.rid }}' $launcher
          if (-not (Test-Path -LiteralPath $path)) { throw "Release is missing required launcher: $launcher" }
      - name: Add portable folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/${{ matrix.rid }}/data | Out-Null
          if ('${{ matrix.rid }}' -eq 'win-x64') {
            Copy-Item -LiteralPath publish/${{ matrix.rid }}/Forge.App.exe -Destination 'publish/${{ matrix.rid }}/Forge Tools.exe'
          }
          Get-ChildItem publish/${{ matrix.rid }} -Filter *.pdb -Recurse | Remove-Item -Force
      - name: Verify friendly Windows launcher
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'publish/win-x64/Forge Tools.exe')) {
            throw 'Release is missing its friendly Forge Tools launcher.'
          }
      - name: Create package
        shell: pwsh
        run: |
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'publish/${{ matrix.rid }}'),
            (Join-Path $PWD 'ForgeTools-${{ matrix.rid }}.zip'))
          $hash = (Get-FileHash ForgeTools-${{ matrix.rid }}.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ForgeTools-${{ matrix.rid }}.zip" | Set-Content ForgeTools-${{ matrix.rid }}.zip.sha256 -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeTools-${{ matrix.rid }}
          path: |
            ForgeTools-${{ matrix.rid }}.zip
            ForgeTools-${{ matrix.rid }}.zip.sha256
          include-hidden-files: true
  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          generate_release_notes: true
          files: artifacts/**/*
